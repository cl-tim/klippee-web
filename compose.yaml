services:
  app:
    image: ${KLIPPEE_IMAGE:-klippee}:${KLIPPEE_VERSION:-selfhost-v0.1.3}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      CAD_API_BASE: http://cad:8080
      KLIPPEE_DATA_DIR: /data
      LOCAL_AUTH_BYPASS: "0"
    ports:
      - "${KLIPPEE_BIND_ADDRESS:-127.0.0.1}:${KLIPPEE_PORT:-8080}:8080"
    volumes:
      - klippee-data:/data
    depends_on:
      cad:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 90s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 2g
    pids_limit: 256
  cad:
    image: ${KLIPPEE_CAD_IMAGE:-klippee-cad}:${KLIPPEE_VERSION:-selfhost-v0.1.3}
    build:
      context: .
      dockerfile: Dockerfile.cad
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 4g
    pids_limit: 256
volumes:
  klippee-data:
