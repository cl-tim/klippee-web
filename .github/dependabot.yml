version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The only Python manifest is server/cad-requirements.txt, a non-standard
  # filename. Dependabot's pip file detection scans the configured directory
  # for requirements-style *.txt/*.in files rather than requiring the literal
  # name requirements.txt, so this entry is expected to pick it up — but the
  # ecosystem has no way to point at a specific manifest explicitly. If the
  # Dependabot UI (Insights -> Dependency graph -> Dependabot) shows no pip
  # job, or no pip PRs ever appear for the exact pins in
  # server/cad-requirements.txt, either rename the file to
  # server/requirements.txt (also update Dockerfile.cad, AGENTS.md,
  # and scripts/python-env.mjs / scripts/setup-dev.mjs) or move the pins into
  # a server/pyproject.toml.
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Track both the standalone app Dockerfile and Dockerfile.cad.
  # Docker detection matches filenames containing "dockerfile" without case
  # sensitivity; verify both manifests in the Dependabot UI.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns:
          - "*"
